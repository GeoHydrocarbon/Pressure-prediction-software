name: Windows release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested Windows package to Releases
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: release_tools/requirements-windows.txt
      - name: Install CPU runtime and packaging tools
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r release_tools/requirements-windows.txt
      - name: Source tests using synthetic fixtures
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
  build:
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release '))
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: release_tools/requirements-windows.txt
      - name: Install CPU runtime and packaging tools
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r release_tools/requirements-windows.txt
      - name: Build standalone Windows application
        run: python -m PyInstaller --noconfirm --clean release_tools/windows.spec
      - name: Verify frozen application without development paths
        run: python release_tools/smoke_frozen.py dist/PressurePrediction
      - name: Package Windows release
        shell: pwsh
        run: |
          Copy-Item release_tools/README-windows.txt dist/PressurePrediction/README.txt
          python -m pip freeze | Out-File -Encoding utf8 dist/PressurePrediction/build-dependencies.txt
          $version = python -c "from overpressure import __version__; print(__version__)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Version and tag do not match' }
          "version=$version`ncommit=$env:GITHUB_SHA`nruntime=Windows x64 CPU" | Out-File -Encoding utf8 dist/PressurePrediction/build-info.txt
          Compress-Archive -Path dist/PressurePrediction -DestinationPath dist/PressurePrediction-Windows-x64-CPU.zip
          $hash = (Get-FileHash dist/PressurePrediction-Windows-x64-CPU.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  PressurePrediction-Windows-x64-CPU.zip" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-CPU
          path: |
            dist/PressurePrediction-Windows-x64-CPU.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') || inputs.publish == true ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release '))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64-CPU
          path: release-assets
      - name: Publish tested package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Select-String -Path overpressure/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          $tag = "v$version"
          gh release view $tag --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; bump the version before publishing" }
          gh release create $tag release-assets/PressurePrediction-Windows-x64-CPU.zip release-assets/SHA256SUMS.txt --repo $env:GH_REPO --target $env:GITHUB_SHA --title "超压预测软件 $tag · Windows CPU" --notes-file release_tools/README-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
